<div>
    <div class="flex items-center justify-between px-3">
        <h1 class="text-2xl p-2 pt-4 font-medium text-gray-800">
            {{ data.title || 'Confirm' }}
        </h1>
    </div>

    <mat-dialog-content class="py-2">
        <p>{{ data.message }}</p>
    </mat-dialog-content>

    <mat-dialog-actions class="flex justify-end space-x-4 p-4 text-sm">
        <button class="bg-black rounded-lg p-2 text-white cursor-pointer" mat-button (click)="onCancel()">
            {{ data.cancelText || 'Cancel' }}
        </button>
        <button class="bg-red-500 rounded-lg p-2 text-white cursor-pointer" mat-raised-button color="warn"
            (click)="onConfirm()">
            {{ data.confirmText || 'Confirm' }}
        </button>
    </mat-dialog-actions>
</div>
