<div class="min-h-screen bg-white-900 text-gray-900 px-8 py-10">
  
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-medium tracking-tight">Data Schema</h1>
    <div>
      <input
        type="text"
        placeholder="Search fields..."
        class="px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button
        (click)="fetchSchema()"
        class="ml-3 px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 font-medium"
      >
        Refresh
      </button>
    </div>
  </div>

  
  <div *ngIf="!loading && schemaData?.result" class="bg-white rounded-2xl shadow-lg p-6">
    <div class="flex items-center justify-between mb-6 border-b border-gray-700 pb-4">
      <div>
        <h2 class="text-2xl font-bold text-blue-400">{{ schemaData.result.tableName }}</h2>
        <p class="text-gray-400 text-sm">
          {{ schemaData.result.columns.length }} columns detected
        </p>
      </div>
      <div class="flex items-center gap-3">
        <button
          (click)="backToConnection()"
          class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm font-medium"
        >
          ← Back
        </button>
      </div>
    </div>

    
    <div class="overflow-hidden rounded-xl border border-gray-700">
      <table class="min-w-full border-collapse bg-gray-900 text-gray-300">
        <thead class="bg-gray-800 text-gray-400 uppercase text-sm">
          <tr>
            <th class="px-5 py-3 text-left font-medium">Field</th>
            <th class="px-5 py-3 text-left font-medium">Type</th>
            <th class="px-5 py-3 text-left font-medium">Rules</th>
            <th class="px-5 py-3 text-left font-medium">Sample Data</th>
            <th class="px-5 py-3 text-left font-medium">Edit</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let col of schemaData.result.columns; let i = index"
            class="border-b border-gray-800 hover:bg-gray-800/70 transition"
          >
            <td class="px-5 py-3 font-medium flex items-center gap-2">
              <span class="text-blue-400">#</span> {{ col.columnName }}
            </td>
            <td class="px-5 py-3">
              <span class="bg-gray-700 text-gray-200 text-xs font-medium px-2 py-1 rounded">
                {{ col.dataType }}
              </span>
            </td>
            <td class="px-5 py-3">
              <span class="bg-green-700/40 text-green-400 text-xs font-medium px-2 py-1 rounded">
                Required
              </span>
            </td>
            <td class="px-5 py-3 text-gray-400 italic">—</td>
            <td class="px-5 py-3">
              <button
                class="text-blue-400 hover:text-blue-300 transition"
                title="Edit column"
              >
                
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  
  <!-- <div *ngIf="loading" class="text-center text-gray-500 mt-10"> Loading schema data...</div> -->
  <div *ngIf="!loading && errorMsg" class="text-center text-red-500 mt-10">{{ errorMsg }}</div>
</div>
