<div class="min-h-screen bg-white text-gray-900 px-8 py-10">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-medium tracking-tight">Data Schema</h1>

    <div class="flex items-center gap-3">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Search fields..."
        class="px-4 py-2 rounded-lg bg-gray-100 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      
      <select
        class="px-4 py-2 rounded-lg border border-gray-300 bg-gray-100 focus:outline-none"
        (change)="onTableSelect($event)"
      >
        <option *ngFor="let table of schemaList" [value]="table.tableName">
          {{ table.tableName }}
        </option>
      </select>

      <button
        
        class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium"
      >
        Refresh
      </button>
    </div>
  </div>

  
  <div *ngIf="!loading && selectedTable" class="bg-white rounded-2xl shadow-lg p-6 mb-8 border border-gray-200">
    <div class="flex items-center justify-between mb-6 border-b border-gray-300 pb-4">
      <div>
        <h2 class="text-2xl font-bold text-blue-600">{{ selectedTable.tableName }}</h2>
        <p class="text-gray-500 text-sm">
          {{ selectedTable.columns?.length || 0 }} columns detected
        </p>
      </div>
    </div>

    <div class="overflow-hidden rounded-xl border border-gray-300">
      <table class="min-w-full border-collapse bg-gray-50 text-gray-800">
        <thead class="bg-gray-200 text-gray-600 uppercase text-sm">
          <tr>
            <th class="px-5 py-3 text-left font-medium w-12"></th>
            <th class="px-5 py-3 text-left font-medium">Field</th>
            <th class="px-5 py-3 text-left font-medium">Type</th>
            <th class="px-5 py-3 text-left font-medium">Rules</th>
            <th class="px-5 py-3 text-left font-medium">Sample Data</th>
            <th class="px-5 py-3 text-left font-medium">Edit</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let col of filteredColumns; let i = index"
            (mouseenter)="setHover(i)"
            (mouseleave)="setHover(null)"
            class="border-b border-gray-200 hover:bg-gray-100 transition"
          >
            <td class="px-5 py-3 text-center">
              <input
                type="checkbox"
                *ngIf="hoveredRow === i || checkedColumns.has(col.columnName)"
                [checked]="checkedColumns.has(col.columnName)"
                (change)="toggleCheckbox(col.columnName)"
                class="cursor-pointer accent-blue-500"
              />
            </td>

            <td class="px-5 py-3 font-medium flex items-center gap-2">
              <span class="text-blue-500">#</span> {{ col.columnName }}
            </td>
            <td class="px-5 py-3">
              <span class="bg-gray-300 text-gray-800 text-xs font-medium px-2 py-1 rounded">
                {{ col.dataType }}
              </span>
            </td>
            <td class="px-5 py-3">
              <span class="bg-green-200 text-green-800 text-xs font-medium px-2 py-1 rounded">
                Required
              </span>
            </td>
            <td class="px-5 py-3 text-gray-500 italic">—</td>
            <td class="px-5 py-3">
              <button
                class="text-blue-500 hover:text-blue-400 transition"
                title="Edit column"
              >
                
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  
  <div
    *ngIf="checkedColumns.size > 0"
    class="fixed bottom-6 right-6 bg-blue-600 text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-4 animate-fade-in"
  >
    <span>{{ checkedColumns.size }} selected</span>
    <button
      (click)="onImportToFormBuilder()"
      class="bg-white text-blue-700 px-3 py-1 rounded-lg hover:bg-gray-200 font-medium"
    >
      Import to Form Builder
    </button>
  </div>

  
  <div *ngIf="loading" class="text-center text-gray-500 mt-10">Loading schema data...</div>
  <div *ngIf="!loading && errorMsg" class="text-center text-red-500 mt-10">{{ errorMsg }}</div>
</div>
