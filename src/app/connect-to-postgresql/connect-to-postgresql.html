  Loading connection form...
</div> -->

<div *ngIf="!loading" class="min-h-screen bg-gray-50 p-8 flex justify-center items-start">
  <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-3xl">
    
  <h2 class="text-2xl font-semibold mb-4">
  Connect to {{ connectorName | titlecase }}
  <span class="text-gray-500 text-sm ml-2">{{ connectorCategory }}</span>
</h2>

    
    <div class="flex border-b mb-4">
      <button
        class="px-4 py-2"
        [ngClass]="{ 'border-b-2 border-blue-600 font-semibold text-blue-600': activeTab === 'basic' }"
        (click)="switchTab('basic')">
        Basic
      </button>
      <button
        class="px-4 py-2"
        [ngClass]="{ 'border-b-2 border-blue-600 font-semibold text-blue-600': activeTab === 'authentication' }"
        (click)="switchTab('authentication')">
        Authentication
      </button>
      <button
        class="px-4 py-2"
        [ngClass]="{ 'border-b-2 border-blue-600 font-semibold text-blue-600': activeTab === 'advanced' }"
        (click)="switchTab('advanced')">
        Advanced
      </button>
    </div>

    
<form *ngIf="connectionForm" [formGroup]="connectionForm" class="space-y-4">

      
      <div *ngFor="let field of getFieldsByTab(activeTab)">
        <label class="block font-medium mb-1">
          {{ field.label }} <span *ngIf="field.required" class="text-red-500">*</span>
        </label>
        <input
          [type]="getInputType(field.type)"
          [formControlName]="field.key"
          [placeholder]="field.label"
          class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500"
        />
      </div>

      
      <div *ngIf="connectionStatus === 'success'" class="text-green-600 font-medium">
         Connection successful!
      </div>
      <div *ngIf="connectionStatus === 'failed'" class="text-red-600 font-medium">
         Connection failed. Please check your details.
      </div>
      <div *ngIf="connectionStatus === 'testing'" class="text-blue-600 font-medium">
        Testing connection...
      </div>

      
      <div class="flex justify-end gap-3 pt-4 border-t mt-6">
        <button type="button"  class="px-4 py-2 border rounded-lg">Cancel</button>
        <button type="button" (click)="testConnection()" class="px-4 py-2 border rounded-lg bg-gray-100">Test Connection</button>
        <button routerLink="/data-engine/data-schema"
  type="button"
  class="px-4 py-2 rounded-lg bg-blue-600 text-white disabled:opacity-50 disabled:cursor-not-allowed"
  (click)="connect()">
  Connect
</button>
      </div>

    </form>
  </div>
</div>
