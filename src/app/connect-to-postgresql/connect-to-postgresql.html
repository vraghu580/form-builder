<div class="min-h-screen bg-gray-50 p-8 flex justify-center items-start">
  <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-3xl">
    <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2">
      <span class="text-orange-500 text-3xl"></span>
      Connect to PostgreSQL <span class="text-gray-500 text-sm ml-2">database</span>
    </h2>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-600 mb-1">Connection Name *</label>
      <input
        type="text"
        class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
        placeholder="e.g., Production PostgreSQL or Analytics DB"
      />
    </div>

    <div class="flex border-b mb-4">
      <button
        class="px-4 py-2"
        [ngClass]="{ 'border-b-2 border-blue-600 font-semibold text-blue-600': activeTab === 'basic' }"
        (click)="switchTab('basic')">
        Basic Settings
      </button>
      <button
        class="px-4 py-2"
        [ngClass]="{ 'border-b-2 border-blue-600 font-semibold text-blue-600': activeTab === 'auth' }"
        (click)="switchTab('auth')">
        Authentication
      </button>
      <button
        class="px-4 py-2"
        [ngClass]="{ 'border-b-2 border-blue-600 font-semibold text-blue-600': activeTab === 'advanced' }"
        (click)="switchTab('advanced')">
        Advanced
      </button>
    </div>

    <form [formGroup]="connectionForm" class="space-y-4">
      <div *ngIf="activeTab === 'basic'">
        <div>
          <label class="block font-medium mb-1">Connection Name *</label>
          <input formControlName="connectionName" class="w-full border rounded-lg px-3 py-2" placeholder="e.g. Production Postgres" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-medium mb-1">Host/Server *</label>
            <input formControlName="host" class="w-full border rounded-lg px-3 py-2" placeholder="localhost or IP address" />
          </div>
          <div>
            <label class="block font-medium mb-1">Port *</label>
            <input formControlName="port" type="number" class="w-full border rounded-lg px-3 py-2" />
          </div>
        </div>

        <div>
          <label class="block font-medium mb-1">Database Name *</label>
          <input formControlName="database" class="w-full border rounded-lg px-3 py-2" placeholder="database_name" />
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block font-medium mb-1">Min Connections</label>
            <input formControlName="minConnections" type="number" class="w-full border rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block font-medium mb-1">Max Connections</label>
            <input formControlName="maxConnections" type="number" class="w-full border rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block font-medium mb-1">Timeout (seconds)</label>
            <input formControlName="timeout" type="number" class="w-full border rounded-lg px-3 py-2" />
          </div>
        </div>
      </div>

      
      <div *ngIf="activeTab === 'auth'" formGroupName="auth" class="space-y-4">
        <div>
          <label class="block font-medium mb-1">Authentication Method</label>
          <select formControlName="method" class="w-full border rounded-lg px-3 py-2">
            <option value="usernamePassword">Username/Password</option>
            <option value="windows">Windows Authentication</option>
            <option value="sslCert">SSL Certificate</option>
            <option value="kerberos">Kerberos</option>
          </select>
        </div>

        <div *ngIf="authMethod === 'usernamePassword'" class="space-y-3">
          <div>
            <label class="block font-medium mb-1">Username</label>
            <input formControlName="username" class="w-full border rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block font-medium mb-1">Password</label>
            <div class="relative">
              <input [type]="passwordVisible ? 'text' : 'password'" formControlName="password" class="w-full border rounded-lg px-3 py-2 pr-10" />
              <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-sm text-gray-500" (click)="passwordVisible = !passwordVisible">
                {{ passwordVisible ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>
        </div>

        <div *ngIf="authMethod === 'windows'" class="space-y-3">
          <p class="text-sm text-gray-500">Uses the OS account; provide domain if required by your driver/environment.</p>
          <div>
            <label class="block font-medium mb-1">Domain</label>
            <input formControlName="domain" class="w-full border rounded-lg px-3 py-2" placeholder="e.g. CORP" />
          </div>
        </div>

        <div *ngIf="authMethod === 'sslCert'" class="space-y-3">
          <div>
            <label class="block font-medium mb-1">SSL Mode</label>
            <select formControlName="sslMode" class="w-full border rounded-lg px-3 py-2">
              <option value="disable">disable</option>
              <option value="allow">allow</option>
              <option value="prefer">prefer</option>
              <option value="require">require</option>
              <option value="verify-ca">verify-ca</option>
              <option value="verify-full">verify-full</option>
            </select>
          </div>

          <div>
            <label class="block font-medium mb-1">Client Certificate (.crt/.pem)</label>
            <input type="file" accept=".crt,.pem" (change)="onFileSelected($event, 'clientCert')" class="w-full border rounded-lg px-3 py-2" />
          </div>

          <div>
            <label class="block font-medium mb-1">Client Key (.key/.pem)</label>
            <input type="file" accept=".key,.pem" (change)="onFileSelected($event, 'clientKey')" class="w-full border rounded-lg px-3 py-2" />
          </div>

          <div>
            <label class="block font-medium mb-1">CA Certificate (.crt/.pem)</label>
            <input type="file" accept=".crt,.pem" (change)="onFileSelected($event, 'clientCA')" class="w-full border rounded-lg px-3 py-2" />
          </div>
        </div>

        <div *ngIf="authMethod === 'kerberos'" class="space-y-3">
          <div>
            <label class="block font-medium mb-1">Principal</label>
            <input formControlName="principal" class="w-full border rounded-lg px-3 py-2" placeholder="user@REALM" />
          </div>
          <div>
            <label class="block font-medium mb-1">Service Name</label>
            <input formControlName="serviceName" class="w-full border rounded-lg px-3 py-2" placeholder="postgres" />
          </div>
          <div>
            <label class="block font-medium mb-1">Keytab (optional)</label>
            <input type="file" accept=".keytab" (change)="onFileSelected($event, 'keytab')" class="w-full border rounded-lg px-3 py-2" />
          </div>
        </div>
      </div>

     
      <div *ngIf="activeTab === 'advanced'">
        <div class="flex items-center gap-2">
          <input id="ssl" formControlName="ssl" type="checkbox" class="h-4 w-4" />
          <label for="ssl" class="font-medium">Enable SSL Connection</label>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t mt-6">
        <button type="button" (click)="cancel()" class="px-4 py-2 border rounded-lg">Cancel</button>
        <button type="button" (click)="testConnection()" class="px-4 py-2 border rounded-lg bg-gray-100">Test Connection</button>
        <button type="button" (click)="connect()" class="px-4 py-2 rounded-lg bg-blue-600 text-white">Connect</button>
      </div>
    </form>
  </div>
</div>
