<div class="max-w-xl mx-auto p-6">
  <h1 class="text-2xl font-semibold mb-4">Edit Connector Type</h1>

  <div *ngIf="loading" class="py-4 text-gray-500">Loading...</div>
  <div *ngIf="error" class="py-2 text-red-600">{{ error }}</div>

  <form [formGroup]="connectorForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
    <div class="mb-4">
      <label class="block font-medium mb-1">Name</label>
      <input formControlName="name" class="w-full border px-3 py-2 rounded" />
    </div>

    <div class="mb-4">
      <label class="block font-medium mb-1">Display Name</label>
      <input formControlName="displayName" class="w-full border px-3 py-2 rounded" />
    </div>

    <div class="mb-4">
      <label class="block font-medium mb-1">Category</label>
      <input formControlName="category" class="w-full border px-3 py-2 rounded" />
    </div>

    <div class="mb-4">
      <label class="block font-medium mb-1">Description</label>
      <textarea formControlName="description" class="w-full border px-3 py-2 rounded"></textarea>
    </div>

    <!-- Optional metadataSchema -->
    <div class="mb-4">
      <label class="block font-medium mb-1">Metadata Schema (JSON)</label>
      <textarea formControlName="metadataSchema" class="w-full border px-3 py-2 rounded"></textarea>
    </div>

    <div class="flex justify-end gap-2"><button type="button"
        [routerLink]="['/connector-type/connector-form']"
        class="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>

      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Update</button>
    </div>
  </form>
</div>
