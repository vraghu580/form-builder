<div class="max-w-3xl mt-10 mx-auto px-6 py-6 bg-gray-50 rounded-xl shadow-md">
  <h2 class="text-2xl font-semibold mb-6 text-gray-800 text-center">Create Connection Type</h2>

  <form [formGroup]="connectionForm" (ngSubmit)="onSubmit()" class="space-y-6 mt-10">
    <!-- Basic Fields -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block font-medium text-gray-700 mb-1">Name</label>
        <input
          type="text"
          formControlName="name"
          class="border border-gray-300 rounded-lg w-full p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="Enter connection name"
        />
      </div>

      <div>
        <label class="block font-medium text-gray-700 mb-1">Display Name</label>
        <input
          type="text"
          formControlName="displayName"
          class="border border-gray-300 rounded-lg w-full p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="Enter display name"
        />
      </div>

      <div>
        <label class="block font-medium text-gray-700 mb-1">Category</label>
        <input
          type="text"
          formControlName="category"
          class="border border-gray-300 rounded-lg w-full p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="e.g. Database, API"
        />
      </div>

      <div>
        <label class="block font-medium text-gray-700 mb-1">description</label>
        <input
          type="text"
          formControlName="description"
          class="border border-gray-300 rounded-lg w-full p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          placeholder="e.g. SQL, NoSQL"
        />
      </div>
    </div>

    <!-- Metadata Schema -->
    <div class="mt-8">
      <h3 class="text-lg font-semibold mb-4 text-gray-800 border-b pb-2">Metadata Schema</h3>

      <div formArrayName="metadataSchema">
        <div
          *ngFor="let field of metadataSchema.controls; let i = index"
          [formGroupName]="i"
          class="border border-gray-200 rounded-lg p-4 mb-4 bg-gray-50 relative shadow-sm"
        >
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-gray-700 mb-1">Key</label>
              <input
                formControlName="key"
                class="border border-gray-300 rounded-lg w-full p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
                placeholder="e.g. host"
              />
            </div>

            <div>
              <label class="block text-gray-700 mb-1">Label</label>
              <input
                formControlName="label"
                class="border border-gray-300 rounded-lg w-full p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
                placeholder="e.g. Host"
              />
            </div>

            <div>
              <label class="block text-gray-700 mb-1">Required</label>
              <div class="flex items-center space-x-2">
                <input
                  type="checkbox"
                  formControlName="required"
                  class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-400"
                />
                <span class="text-sm text-gray-600">Mark as required</span>
              </div>
            </div>

            <div>
              <label class="block text-gray-700 mb-1">Type</label>
              <select
                formControlName="type"
                class="border border-gray-300 rounded-lg w-full p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
              >
                <option value="">Select Type</option>
                <option value="string">String</option>
                <option value="number">Number</option>
                <option value="boolean">Boolean</option>
              </select>
            </div>
          </div>

          <!-- Remove Button -->
          <button
            type="button"
            (click)="removeMetadataField(i)"
            class="absolute top-2 right-2 text-red-500 hover:text-red-700 text-lg font-bold"
            title="Remove field"
          >
            ✕
          </button>
        </div>
      </div>

      <div class="flex justify-center sm:justify-start">
        <button
          type="button"
          (click)="addMetadataField()"
          class="mt-2 bg-blue-600 text-white px-5 py-2 rounded-lg shadow hover:bg-blue-700 transition"
        >
          + Add Metadata Field
        </button>
      </div>
    </div>

    <!-- Submit -->
    <div class="mt-8 text-center sm:text-left">
      <button
        type="submit"
        class="bg-green-600 text-white px-6 py-2.5 rounded-lg shadow hover:bg-green-700 transition">
        Save Connection
      </button>
    </div>
  </form>
</div>
