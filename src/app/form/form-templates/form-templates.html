<div class="min-h-screen bg-gray-50 p-8">
  <div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-3xl font-semibold text-gray-800">📋 Choose a Form Template</h2>
      <button (click)="exit()" class="text-gray-500 hover:text-red-600 text-2xl">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Template Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 auto-rows-fr">
      <div *ngFor="let tmpl of templates"
        class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 p-6 border border-gray-100 hover:border-blue-400 flex flex-col h-full">

        <!-- Template Header -->
        <div class="flex justify-between items-start mb-4">
          <h3 class="text-lg font-semibold text-gray-800">{{ tmpl.title }}</h3>
          <span class="text-xs rounded-full px-2 py-0.5"
            [ngClass]="{
              'bg-blue-500 text-white': tmpl.type === 'single-page',
              'bg-green-500 text-white': tmpl.type === 'multi-page',
              'bg-black text-white': tmpl.type === 'form-page'
            }">
            {{ tmpl.type }}
          </span>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
          <p class="text-sm text-gray-500 mb-4">{{ tmpl.description }}</p>

          <!-- Direct Fields -->
          <div *ngIf="tmpl.fields?.length" class="space-y-2 mb-2 max-h-40 overflow-auto">
            <ul class="list-disc list-inside text-gray-500 text-sm ml-2">
              <li *ngFor="let f of tmpl.fields">
                {{ f.label }} <span class="text-xs text-gray-400">({{ f.type }})</span>
              </li>
            </ul>
          </div>

          <!-- Sectioned Fields -->
          <div *ngIf="tmpl.sections?.length" class="space-y-2 max-h-56 overflow-auto">
            <div *ngFor="let section of tmpl.sections" class="border rounded-md p-2 bg-gray-50 mb-2">
              <p class="font-medium text-gray-700">{{ section.section }}</p>

              <ul *ngIf="section.fields?.length" class="list-disc list-inside text-gray-500 text-sm ml-2">
                <li *ngFor="let field of section.fields">
                  {{ field.label }}
                  <span class="text-xs text-gray-400">({{ field.type }})</span>
                </li>
              </ul>

              <!-- Subsections -->
              <div *ngIf="section.subsections?.length" class="ml-3 mt-2 space-y-1">
                <div *ngFor="let sub of section.subsections" class="border-l-2 border-gray-200 pl-2">
                  <p class="text-gray-600 text-sm font-medium">{{ sub.subsection }}</p>
                  <ul *ngIf="sub.fields?.length" class="list-disc list-inside text-gray-500 text-sm ml-2">
                    <li *ngFor="let f of sub.fields">
                      {{ f.label }}
                      <span class="text-xs text-gray-400">({{ f.type }})</span>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-auto pt-4 flex justify-center gap-4">
          <button
            (click)="openPreviewDialog(tmpl)"
            class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-md text-black border border-input bg-white h-9 rounded-md px-3 cursor-pointer hover:bg-gray-100">
            <i class="bi bi-eye text-md"></i>
          </button>

          <button
            (click)="openTemplate(tmpl.id, 'edit')"
            class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-md text-black border border-input bg-white h-9 rounded-md px-3 cursor-pointer hover:bg-gray-100">
            <i class="bi bi-pencil-square"></i>
          </button>

          <button
            (click)="openTemplate(tmpl.id, 'new')"
            class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-md text-black border border-input bg-white h-9 rounded-md px-3 cursor-pointer hover:bg-gray-100">
            <i class="bi bi-plus-circle"></i>
          </button>
        </div>

      </div>
    </div> <!-- End Grid -->
  </div>
</div>
