<div class="p-6 bg-white rounded-2xl shadow-xl w-full max-w-2xl">

  <!-- Header -->
  <div class="flex justify-between items-center mb-5 border-b pb-3">
    <h2 class="text-2xl font-semibold text-gray-800 flex items-center gap-2">
      <!-- <i class="bi bi-eye-fill text-blue-600"></i> -->
      {{ data.title }} Preview
    </h2>
    <button
      mat-icon-button
      (click)="closeDialog()"
      class="text-gray-500 hover:text-red-500 transition">
      <i class="bi bi-x-lg text-lg"></i>
    </button>
  </div>

  <!-- Description -->
  <p class="text-gray-600 mb-5">{{ data.description }}</p>

  <!-- Fields -->
  <div *ngIf="data.fields?.length" class="space-y-4">
    <p class="font-medium text-gray-700 text-lg border-l-4 border-blue-500 pl-2">Fields</p>
    <div *ngFor="let field of data.fields" class="flex flex-col">
      <label class="text-gray-700 text-sm font-medium mb-1">{{ field.label }}</label>
      <input
        [type]="field.type === 'textarea' ? 'text' : field.type"
        [placeholder]="field.type | titlecase"
        [readonly]="true"
        class="border rounded-lg px-3 py-2 text-gray-700 bg-gray-50 focus:outline-none cursor-not-allowed"
      />
    </div>
  </div>

  <!-- Sections -->
  <div *ngIf="data.sections?.length" class="mt-8 space-y-6">
    <p class="font-medium text-gray-700 text-lg border-l-4 border-green-500 pl-2">Sections</p>

    <div
      *ngFor="let section of data.sections"
      class="border rounded-xl p-4 bg-gray-50 hover:shadow-md transition"
    >
      <h3 class="font-semibold text-gray-800 mb-3">
        <i class="bi bi-diagram-3 text-green-600"></i>
        {{ section.section }}
      </h3>

      <!-- Section fields -->
      <div *ngIf="section.fields?.length" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div *ngFor="let f of section.fields" class="flex flex-col">
          <label class="text-gray-700 text-sm font-medium mb-1">{{ f.label }}</label>
          <input
            [type]="f.type === 'textarea' ? 'text' : f.type"
            [placeholder]="f.type | titlecase"
            [readonly]="true"
            class="border rounded-lg px-3 py-2 text-gray-700 bg-gray-50 focus:outline-none cursor-not-allowed"
          />
        </div>
      </div>

      <!-- Subsections -->
      <div *ngIf="section.subsections?.length" class="mt-4 pl-3 border-l-2 border-gray-200 space-y-4">
        <div *ngFor="let sub of section.subsections" class="bg-white rounded-lg p-3 shadow-sm">
          <h4 class="text-gray-700 font-medium mb-2">
            <i class="bi bi-list-ul text-blue-500"></i>
            {{ sub.subsection }}
          </h4>
          <div *ngIf="sub.fields?.length" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div *ngFor="let f of sub.fields" class="flex flex-col">
              <label class="text-gray-700 text-sm font-medium mb-1">{{ f.label }}</label>
              <input
                [type]="f.type === 'textarea' ? 'text' : f.type"
                [placeholder]="f.type | titlecase"
                [readonly]="true"
                class="border rounded-lg px-3 py-2 text-gray-700 bg-gray-50 focus:outline-none cursor-not-allowed"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="mt-6 flex justify-end">
    <button
      mat-raised-button
      color="primary"
      class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg shadow-md"
      (click)="closeDialog()"
    >
      Close
    </button>
  </div>
</div>
